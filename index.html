<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Piano - Synthwave Melody Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0a1a2e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #fff;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 20px #ff00ff, 0 0 40px #ff00ff;
            background: linear-gradient(90deg, #ff00ff, #00ffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #888;
            margin-bottom: 30px;
            font-size: 1rem;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        textarea {
            width: 100%;
            height: 200px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #ff00ff;
            border-radius: 10px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: #00ffff;
            resize: vertical;
            outline: none;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.3);
            transition: box-shadow 0.3s;
        }

        textarea:focus {
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.5);
        }

        textarea::placeholder {
            color: #666;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin: 20px 0;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #playBtn {
            background: linear-gradient(135deg, #ff00ff, #ff0080);
            color: white;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.5);
        }

        #playBtn:hover {
            box-shadow: 0 0 40px rgba(255, 0, 255, 0.8);
            transform: scale(1.05);
        }

        #stopBtn {
            background: linear-gradient(135deg, #00ffff, #0080ff);
            color: white;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }

        #stopBtn:hover {
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.8);
            transform: scale(1.05);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .settings {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            justify-content: center;
            flex-wrap: wrap;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #333;
        }

        .setting {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .setting label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
        }

        .setting input {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #ff00ff;
            border-radius: 5px;
            padding: 5px 10px;
            color: #00ffff;
            font-size: 14px;
            width: 80px;
            text-align: center;
        }

        #visualizer {
            width: 100%;
            height: 200px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #00ffff;
            border-radius: 10px;
            margin-top: 20px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }

        .status {
            text-align: center;
            margin-top: 15px;
            color: #ff00ff;
            font-size: 14px;
            min-height: 20px;
        }

        .current-char {
            text-align: center;
            margin-top: 10px;
            font-size: 24px;
            color: #00ffff;
            min-height: 30px;
            text-shadow: 0 0 10px #00ffff;
        }
    </style>
</head>
<body>
    <h1>🎹 Code Piano</h1>
    <p class="subtitle">Synthwave Melody Generator</p>
    
    <div class="container">
        <textarea id="codeInput" placeholder="Paste your code here...">function createSynthwave() {
    const neon = {
        colors: ['#ff00ff', '#00ffff', '#ff0080'],
        glow: 'infinite'
    };
    
    return {
        play: () => {
            console.log('Synthwave activated!');
            return neon.glow;
        }
    };
}

const melody = createSynthwave();
melody.play();</textarea>
        
        <div class="settings">
            <div class="setting">
                <label>Tempo (ms)</label>
                <input type="number" id="tempo" value="150" min="50" max="500">
            </div>
            <div class="setting">
                <label>Volume</label>
                <input type="number" id="volume" value="-10" min="-30" max="0">
            </div>
        </div>
        
        <div class="controls">
            <button id="playBtn">▶ Play</button>
            <button id="stopBtn" disabled>⏹ Stop</button>
        </div>
        
        <canvas id="visualizer"></canvas>
        
        <div class="status" id="status"></div>
        <div class="current-char" id="currentChar"></div>
    </div>

    <script>
        let synth;
        let analyser;
        let isPlaying = false;
        let animationId;
        let playTimeout;

        // Инициализация Tone.js
        async function initAudio() {
            await Tone.start();
            
            // Создание Synthwave синтезатора
            const polySynth = new Tone.PolySynth(Tone.Synth, {
                oscillator: {
                    type: "sawtooth"
                },
                envelope: {
                    attack: 0.05,
                    decay: 0.2,
                    sustain: 0.3,
                    release: 0.8
                }
            });
            
            // Добавление эффектов для Synthwave звучания
            const reverb = new Tone.Reverb({
                decay: 2.5,
                preDelay: 0.01
            }).toDestination();
            
            const delay = new Tone.FeedbackDelay({
                delayTime: "8n",
                feedback: 0.3,
                wet: 0.4
            }).toDestination();
            
            const chorus = new Tone.Chorus({
                frequency: 1.5,
                delayTime: 3.5,
                depth: 0.7,
                wet: 0.5
            }).toDestination();
            
            const filter = new Tone.Filter({
                type: "lowpass",
                frequency: 2000,
                Q: 1
            });
            
            // Подключение цепочки эффектов
            polySynth.connect(filter);
            filter.connect(chorus);
            chorus.connect(delay);
            delay.connect(reverb);
            
            // Создание анализатора для визуализации
            analyser = new Tone.Analyser("waveform", 256);
            polySynth.connect(analyser);
            
            // Установка громкости
            polySynth.volume.value = parseFloat(document.getElementById('volume').value);
            
            synth = polySynth;
            
            document.getElementById('status').textContent = 'Audio initialized! Press Play.';
        }

        // Преобразование ASCII кода в частоту
        function asciiToFrequency(char) {
            const ascii = char.charCodeAt(0);
            // Карта частот для приятного звучания (пентатоника)
            const baseFreq = 130.81; // C3
            const scale = [1, 9/8, 5/4, 3/2, 5/3, 2]; // Пентатоника
            const octave = Math.floor(ascii / 32) % 4;
            const noteIndex = ascii % scale.length;
            const freq = baseFreq * scale[noteIndex] * Math.pow(2, octave);
            return Math.min(freq, 2000); // Ограничение частоты
        }

        // Визуализация звуковых волн
        function visualize() {
            const canvas = document.getElementById('visualizer');
            const ctx = canvas.getContext('2d');
            
            // Установка размера canvas
            canvas.width = canvas.offsetWidth * 2;
            canvas.height = canvas.offsetHeight * 2;
            ctx.scale(2, 2);
            
            const width = canvas.offsetWidth;
            const height = canvas.offsetHeight;
            
            function draw() {
                animationId = requestAnimationFrame(draw);
                
                if (!analyser) return;
                
                const waveform = analyser.getValue();
                
                // Очистка canvas с эффектом затухания
                ctx.fillStyle = 'rgba(10, 10, 26, 0.3)';
                ctx.fillRect(0, 0, width, height);
                
                // Рисование сетки
                ctx.strokeStyle = 'rgba(255, 0, 255, 0.1)';
                ctx.lineWidth = 1;
                for (let i = 0; i < width; i += 20) {
                    ctx.beginPath();
                    ctx.moveTo(i, 0);
                    ctx.lineTo(i, height);
                    ctx.stroke();
                }
                for (let i = 0; i < height; i += 20) {
                    ctx.beginPath();
                    ctx.moveTo(0, i);
                    ctx.lineTo(width, i);
                    ctx.stroke();
                }
                
                // Рисование волны
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#00ffff';
                ctx.shadowColor = '#00ffff';
                ctx.shadowBlur = 10;
                
                ctx.beginPath();
                const sliceWidth = width / waveform.length;
                let x = 0;
                
                for (let i = 0; i < waveform.length; i++) {
                    const v = waveform[i];
                    const y = (v + 1) / 2 * height;
                    
                    if (i === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                    x += sliceWidth;
                }
                
                ctx.stroke();
                
                // Вторая волна (отражение)
                ctx.strokeStyle = '#ff00ff';
                ctx.shadowColor = '#ff00ff';
                ctx.beginPath();
                x = 0;
                
                for (let i = 0; i < waveform.length; i++) {
                    const v = waveform[i];
                    const y = height - (v + 1) / 2 * height;
                    
                    if (i === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                    x += sliceWidth;
                }
                
                ctx.stroke();
                ctx.shadowBlur = 0;
            }
            
            draw();
        }

        // Воспроизведение мелодии
        async function playMelody() {
            const code = document.getElementById('codeInput').value;
            const tempo = parseInt(document.getElementById('tempo').value);
            
            if (!code.trim()) {
                document.getElementById('status').textContent = 'Enter code to play!';
                return;
            }
            
            if (!synth) {
                await initAudio();
            }
            
            isPlaying = true;
            document.getElementById('playBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            document.getElementById('status').textContent = 'Playing...';
            
            const chars = code.split('');
            let index = 0;
            
            function playNext() {
                if (!isPlaying || index >= chars.length) {
                    stopMelody();
                    return;
                }
                
                const char = chars[index];
                document.getElementById('currentChar').textContent = `Character: "${char}" (ASCII: ${char.charCodeAt(0)})`;
                
                // Пропуск пробелов и спецсимволов
                if (char.trim() === '' || char.charCodeAt(0) < 32) {
                    index++;
                    playTimeout = setTimeout(playNext, tempo / 2);
                    return;
                }
                
                const freq = asciiToFrequency(char);
                synth.triggerAttackRelease(freq, tempo / 1000);
                
                index++;
                playTimeout = setTimeout(playNext, tempo);
            }
            
            playNext();
        }

        // Остановка воспроизведения
        function stopMelody() {
            isPlaying = false;
            clearTimeout(playTimeout);
            if (synth) {
                synth.releaseAll();
            }
            document.getElementById('playBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            document.getElementById('status').textContent = 'Stopped';
            document.getElementById('currentChar').textContent = '';
        }

        // Обработчики событий
        document.getElementById('playBtn').addEventListener('click', async () => {
            if (!synth) {
                await initAudio();
            }
            playMelody();
        });

        document.getElementById('stopBtn').addEventListener('click', stopMelody);

        // Инициализация визуализации при загрузке
        window.addEventListener('load', () => {
            visualize();
            document.getElementById('status').textContent = 'Press Play to start (user interaction required)';
        });

        // Обработка изменения громкости
        document.getElementById('volume').addEventListener('change', (e) => {
            if (synth) {
                synth.volume.value = parseFloat(e.target.value);
            }
        });

        // Очистка при закрытии
        window.addEventListener('beforeunload', () => {
            stopMelody();
            if (animationId) {
                cancelAnimationFrame(animationId);
            }
        });
    </script>
</body>
</html>
